name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: beneflex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Lint
        run: ruff check app/ tests/

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/beneflex_test
          APP_ENV: test
          ENCRYPTION_KEY: test-encryption-key-for-ci
        run: pytest tests/ -v --cov=app --cov-report=term-missing

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy-backend:
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Deployment to Railway/Render configured via their GitHub integration
      # This step is a placeholder — actual deployment is triggered by the
      # hosting platform's GitHub webhook on push to main.
      - name: Deploy notification
        run: echo "Backend deployment triggered via hosting platform webhook"

  deploy-frontend:
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Vercel deploys automatically on push to main via GitHub integration
      - name: Deploy notification
        run: echo "Frontend deployment triggered via Vercel webhook"
